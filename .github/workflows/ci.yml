name: Drag and drop tests
on:
  push:
    # Tag pushes are covered by publish.yml, which calls this workflow as
    # its test gate.
    branches:
      - "**"
  workflow_dispatch:
  workflow_call:
jobs:
  playwright:
    name: "Playwright tests (${{ matrix.project }})"
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    # Official Playwright image: every browser and its system dependencies are
    # preinstalled, so no apt step (WebKit's ~126 MB of apt packages on a slow
    # mirror kept timing the job out). Keep the tag in sync with
    # @playwright/test; the "Check Playwright image version" step enforces it.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    strategy:
      # One shard per Playwright project: the full suite serially exceeds the
      # job timeout, and sharding keeps each run well inside it.
      fail-fast: false
      matrix:
        include:
          - project: Desktop Chrome
            browser: chromium
            slug: chrome
          - project: Desktop Firefox
            browser: firefox
            slug: firefox
          - project: Desktop Webkit
            browser: webkit
            slug: webkit
          - project: iPhone 13 Chromium
            browser: chromium
            slug: mobile-chromium
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Pinned: Node 24.16.0 hangs Playwright's browser download at 100%
          # (stream never finalizes). 24.15.0 is the last verified-good
          # version on these runners — bump deliberately, with a green run.
          node-version: 24.15.0
      - name: Update npm
        run: npm install -g npm@latest
      - name: Verify runtime
        run: |
          node --version
          npm --version
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - run: pnpm install --frozen-lockfile
      - name: Build Dev Frameworks
        run: cd tests-frameworks && pnpm install && cd ..
      - name: Build Dev
        run: cd tests && pnpm install && cd ..
      - name: Check Playwright image version
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "1.59.1" ]; then
            echo "::error::@playwright/test is $installed but the CI container is v1.59.1-noble. Update the image tag in ci.yml."
            exit 1
          fi
      - name: Run Playwright tests
        run: pnpm exec playwright test --project "${{ matrix.project }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.slug }}
          path: playwright-report/
          retention-days: 30
